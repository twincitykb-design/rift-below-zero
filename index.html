
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Rift Below Zero | The Summoner's Seal">
<meta property="og:description" content="Break the seal. Answer the call to Summoner's Rift.">
<title>Rift Below Zero</title>
<link rel="icon" href="data:,">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 35%, #183e59, #050c17 75%);
    color: #e5edf6;
    font-family: Georgia, serif;
    min-height: 100vh;
    text-align: center;
}

main {
    position: relative;
    z-index: 2;
    max-width: 660px;
    margin: auto;
    padding: 48px 20px;
}

small, .eyebrow {
    letter-spacing: .25em;
    color: #cbb17d;
    font-size: 11px;
    text-transform: uppercase;
}

h1 {
    font-weight: normal;
    font-size: clamp(36px, 8vw, 62px);
    color: #e9d5a3;
    margin: 20px 0;
    text-shadow: 0 0 25px #6bcaff55;
}

p {
    line-height: 1.65;
}

button, select, input {
    font: inherit;
    padding: 12px 18px;
    border: 1px solid #b99b63;
    background: #11283d;
    color: #f4dfae;
    border-radius: 4px;
    max-width: 100%;
}

button {
    cursor: pointer;
}

button:hover {
    background: #244960;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

button:focus-visible {
    outline: 3px solid #93e5ff;
}

.envelope {
    position: relative;
    width: min(90%, 440px);
    aspect-ratio: 1.65;
    margin: 65px auto 35px;
    perspective: 900px;
    filter: drop-shadow(0 0 35px #66c8ff33);
}

.base {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #29465c, #0a182a);
    border: 1px solid #c9ac72;
}

.fold {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.flap {
    position: absolute;
    inset: 0;
    background: linear-gradient(#34566c, #152a40);
    clip-path: polygon(0 0, 100% 0, 50% 66%);
    transform-origin: top;
    transition: transform 1s;
    z-index: 3;
}

.seal {
    position: absolute;
    left: 50%;
    top: 64%;
    transform: translate(-50%, -50%);
    z-index: 4;
    border-radius: 50%;
    width: 76px;
    height: 76px;
    padding: 0;
    font-size: 38px;
    background: radial-gradient(#76dfff, #22538a 60%, #13263f);
    box-shadow: 0 0 24px #69dfff;
    transition: opacity .4s;
}

.opened .flap {
    transform: rotateX(180deg);
}

.opened .seal {
    opacity: 0;
    pointer-events: none;
}

.letter {
    background: linear-gradient(140deg, #e9dfbf, #c7ba92);
    border: double 6px #9c8050;
    color: #172e40;
    padding: 35px 20px;
    box-shadow: 0 0 50px #9bdfff22;
    animation: rise 1s ease both;
}

.letter h1 {
    color: #17334a;
    text-shadow: none;
}

.letter small {
    color: #765c32;
}

.count {
    font-size: clamp(19px, 5vw, 30px);
    letter-spacing: .08em;
    font-variant-numeric: tabular-nums;
    margin: 20px 0;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px;
}

.snow {
    position: fixed;
    top: -15px;
    color: #c1eaff;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 1;
}

#music {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 5;
    font-size: 12px;
}

#riot {
    width: 100%;
    max-width: 320px;
    margin-top: 10px;
}

#status, #loading {
    overflow-wrap: anywhere;
}

[hidden] {
    display: none !important;
}

@keyframes fall {
    to {
        transform: translate(50px, 110vh);
    }
}

@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(35px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }

    .snow {
        display: none;
    }
}
</style>
</head>

<body>

<button id="music" aria-pressed="false">
    ♫ Music off
</button>

<main>

    <p id="loading" role="status">
        Seeking your summons…
    </p>

    <div class="eyebrow">
        The Council of Runeterra
    </div>

    <section id="closed" hidden>

        <h1>A summons has arrived.</h1>

        <p>
            <strong id="to">Summoner</strong>
            — a message from the frozen north.
        </p>

        <div class="envelope" id="env">

            <div class="base"></div>

            <svg class="fold"
                 viewBox="0 0 440 267"
                 preserveAspectRatio="none">

                <path d="M0 267 L220 112 L440 267
                         M0 0 L220 176 L440 0"
                      fill="none"
                      stroke="#b99b63"/>

                <path d="M12 12 H428 V255 H12Z"
                      fill="none"
                      stroke="#b99b63"
                      opacity=".35"/>

            </svg>

            <div class="flap"></div>

            <button class="seal"
                    id="seal"
                    aria-label="Break the Hextech seal">
                ◇
            </button>

        </div>

        <p>
            <small>
                Break the Hextech seal to reveal your fate
            </small>
        </p>

    </section>

    <section id="letter" class="letter" hidden>

        <small>By decree of the Troll King</small>

        <h1 id="eventTitle">Rift Below Zero</h1>

        <p>
            Dear <strong id="guest">Summoner</strong>,
        </p>

        <p id="message"></p>

        <p>
            <b id="eventDisplay"></b>
            <br>
            <span id="local"></span>
        </p>

        <div class="count" id="count"></div>

        <small>No LP. No rank. Only glory.</small>

        <hr>

        <form id="rsvp">

            <label for="riot">Summoner / Riot ID</label>

            <br>

            <input id="riot"
                   required
                   maxlength="80"
                   placeholder="Name#TAG">

            <p>
                <label for="role">
                    Your preferred role
                </label>
            </p>

            <select id="role">
                <option>Fill</option>
                <option>Top</option>
                <option>Jungle</option>
                <option>Mid</option>
                <option>ADC</option>
                <option>Support</option>
            </select>

            <div class="actions">

                <button type="submit" value="Accept">
                    Accept summons
                </button>

                <button type="submit" value="Decline">
                    Decline
                </button>

            </div>

        </form>

        <p id="status" role="status"></p>

        <p>
            <small>
                Hosted by Kcolder718 • Unofficial fan event
            </small>
        </p>

    </section>

    <p>
        <button id="replay" hidden>
            Reseal invitation
        </button>
    </p>

</main>

<!-- SUPABASE LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// =====================================
// SUPABASE CONFIGURATION
// =====================================

const SUPABASE_URL =
    'https://kizjnsbmrknvmvajzaz.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_qVlRGfStVG1ZVxiybW8wXQ_4sUu_Y6t';

const $ = id => document.getElementById(id);

const params = new URLSearchParams(
    window.location.search
);

const eventId = params.get('event') || 'rift-001';

const guestName = (
    params.get('guest') || ''
).slice(0, 80);

let db;
let currentEvent;
let countdownTimer;
let openingTimer;

// =====================================
// LOAD EVENT FROM SUPABASE
// =====================================

async function initialize() {

    try {

        if (!window.supabase ||
            typeof window.supabase.createClient !== 'function') {

            throw new Error(
                'Supabase library failed to load.'
            );

        }

        db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.info('Supabase client initialized');

        const { data, error } = await db
            .from('events')
            .select('*')
            .eq('id', eventId)
            .single();

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error('Event not found.');
        }

        currentEvent = data;

        const eventDate = new Date(
            currentEvent.starts_at
        );

        if (Number.isNaN(eventDate.getTime())) {
            throw new Error('Invalid event date.');
        }

        $('eventTitle').textContent =
            currentEvent.title;

        $('message').textContent =
            currentEvent.message || '';

        $('to').textContent =
            guestName || 'Summoner';

        $('guest').textContent =
            guestName || 'Summoner';

        $('riot').value = guestName;

        $('eventDisplay').textContent =
            eventDate.toLocaleString('en-US', {
                timeZone: 'America/New_York',
                dateStyle: 'full',
                timeStyle: 'short'
            }) + ' ET';

        $('local').textContent =
            'Your local time: ' +
            eventDate.toLocaleString();

        document.title =
            currentEvent.title +
            " | The Summoner's Seal";

        const colors = {
            shadow: '#16493d',
            demacia: '#776747',
            freljord: '#36729b',
            hybrid: '#183e59'
        };

        const color =
            colors[currentEvent.theme] ||
            colors.hybrid;

        document.body.style.background =
            `radial-gradient(ellipse at 50% 35%,
            ${color}, #050c17 75%)`;

        function tick() {

            const seconds = Math.max(
                0,
                Math.floor(
                    (eventDate - Date.now()) / 1000
                )
            );

            const days =
                Math.floor(seconds / 86400);

            const hours =
                Math.floor(seconds / 3600) % 24;

            const minutes =
                Math.floor(seconds / 60) % 60;

            const remaining = seconds % 60;

            $('count').textContent = seconds
                ? `${days}d : ${hours}h : ${minutes}m : ${remaining}s`
                : 'The scheduled start time has arrived';

        }

        clearInterval(countdownTimer);

        tick();

        countdownTimer = setInterval(tick, 1000);

        $('loading').hidden = true;
        $('closed').hidden = false;

        console.info('Event loaded:', eventId);

    } catch (error) {

        console.error('Invitation error:', error);

        $('loading').textContent =
            'Invitation unavailable: ' +
            (error.message || String(error));

    }

}

// =====================================
// SNOW ANIMATION
// =====================================

for (let i = 0; i < 48; i++) {

    const snow = document.createElement('span');

    snow.className = 'snow';

    snow.textContent = '•';

    snow.style.cssText = `
        left: ${Math.random() * 100}%;
        font-size: ${5 + Math.random() * 9}px;
        opacity: ${.2 + Math.random() * .7};
        animation-duration: ${8 + Math.random() * 15}s;
        animation-delay: ${-Math.random() * 20}s;
    `;

    document.body.appendChild(snow);

}

// =====================================
// ENVELOPE ANIMATION
// =====================================

$('seal').onclick = () => {

    $('seal').disabled = true;

    $('env').classList.add('opened');

    openingTimer = setTimeout(() => {

        $('closed').hidden = true;
        $('letter').hidden = false;
        $('replay').hidden = false;

    }, 950);

};

$('replay').onclick = () => {

    clearTimeout(openingTimer);

    $('letter').hidden = true;
    $('closed').hidden = false;
    $('replay').hidden = true;

    $('env').classList.remove('opened');

    $('seal').disabled = false;

};

// =====================================
// RSVP SUBMISSION
// =====================================

$('rsvp').onsubmit = async function(e) {

    e.preventDefault();

    const name = $('riot').value.trim();

    if (!name) {

        $('status').textContent =
            'Please enter your Riot ID.';

        return;

    }

    if (!db || !currentEvent) {

        $('status').textContent =
            'Event connection unavailable. Refresh and try again.';

        return;

    }

    const decision =
        e.submitter?.value || 'Accept';

    const role = decision === 'Accept'
        ? $('role').value
        : 'N/A';

    const buttons =
        this.querySelectorAll('button');

    buttons.forEach(button => {
        button.disabled = true;
    });

    $('status').textContent =
        'Sending your response…';

    try {

        const { error } = await db
            .from('rsvps')
            .insert({

                event_id: currentEvent.id,
                guest: name,
                decision: decision,
                role: role

            });

        if (error) {
            throw error;
        }

        $('status').textContent =
            decision === 'Accept'
                ? 'Your summons has been accepted. See you on the Rift, ' + name + '!'
                : 'Your response has been received. Thank you, ' + name + '.';

        console.info('RSVP saved successfully');

    } catch (error) {

        console.error('RSVP submission failed:', error);

        $('status').textContent =
            'Response not sent: ' +
            (error.message || String(error));

    } finally {

        buttons.forEach(button => {
            button.disabled = false;
        });

    }

};

// =====================================
// ORIGINAL AMBIENT MUSIC
// =====================================

let audio;
let bus;
let loop;

function phrase() {

    const now = audio.currentTime;

    const frequencies = [
        130.81,
        155.56,
        196,
        293.66,
        261.63,
        196
    ];

    frequencies.forEach((frequency, i) => {

        const oscillator =
            audio.createOscillator();

        const gain = audio.createGain();

        oscillator.type =
            i < 3 ? 'sine' : 'triangle';

        oscillator.frequency.value =
            frequency;

        const time =
            now + (i < 3 ? 0 : (i - 3) * 1.7);

        gain.gain.setValueAtTime(0, time);

        gain.gain.linearRampToValueAtTime(
            i < 3 ? .035 : .018,
            time + 1
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            time + 5.7
        );

        oscillator.connect(gain);

        gain.connect(bus);

        oscillator.start(time);

        oscillator.stop(time + 6);

    });

}

$('music').onclick = async function() {

    try {

        if (loop) {

            clearInterval(loop);

            loop = null;

            await audio.suspend();

            $('music').textContent =
                '♫ Music off';

            $('music').setAttribute(
                'aria-pressed', 'false'
            );

        } else {

            if (!audio) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                audio = new AudioContext();

                bus = audio.createGain();

                bus.gain.value = .65;

                bus.connect(audio.destination);

            }

            await audio.resume();

            phrase();

            loop = setInterval(phrase, 6500);

            $('music').textContent =
                '♫ Music on';

            $('music').setAttribute(
                'aria-pressed', 'true'
            );

        }

    } catch (error) {

        console.error('Audio error:', error);

        $('music').textContent =
            'Audio unavailable';

    }

};

// =====================================
// START WEBSITE
// =====================================

initialize();

</script>

</body>
</html>
