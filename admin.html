<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="Rift Below Zero | The Summoner’s Seal"><meta property="og:description" content="Break the seal. Answer the call to Summoner’s Rift."><title>Rift Below Zero</title><style> *{box-sizing:border-box}body{margin:0;background:#081421;color:#e4edf5;font:16px system-ui}main{max-width:1050px;margin:auto;padding:30px 18px}h1,h2{color:#e4ce98}small{color:#91adc2}section{background:#102337;border:1px solid #34536b;border-radius:12px;padding:22px;margin:18px 0}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;color:inherit;background:#0a1929;border:1px solid #50718a;border-radius:6px;padding:10px}input,select,textarea{width:100%}button{cursor:pointer;margin:5px 4px 5px 0}button:hover{background:#244760}.primary{background:#285b77}textarea{min-height:95px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #34536b}td input,td select{min-width:100px}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}a{color:#9bdfff}#notice{color:#a3dfcb}[hidden]{display:none!important}</style><main><small>THE SUMMONER’S SEAL</small><h1>Rift Command Center</h1><p id="notice" role="status"></p><section id="login"><form id="auth"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form></section><div id="panel" hidden><button id="logout">Sign out</button><section><label>Event<select id="events"></select></label><button id="new">New event</button><button id="duplicate">Duplicate event</button><form id="settings"><label>Event ID<input id="id" readonly></label><label>Title<input id="title" required maxlength="100"></label><div class="grid"><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" required></label><label>UTC offset<select id="zone"><option>-05:00</option><option>-04:00</option><option>-07:00</option><option>+00:00</option></select></label><label>Theme<select id="theme"><option value="hybrid">Freljord × Hextech</option><option value="freljord">Freljord</option><option value="shadow">Shadow Isles</option><option value="demacia">Demacia</option></select></label></div><label>Message<textarea id="message" required maxlength="1200"></textarea></label><button class="primary">Save event</button></form></section><section><h2>Invitations</h2><label>Guest name (blank for public invitation)<input id="guest" maxlength="80"></label><button id="generate">Generate link</button><input id="link" readonly><button id="copy">Copy</button><a id="preview" target="_blank" rel="noopener">Preview</a></section><section><h2>Live responses</h2><button id="refresh">Refresh RSVPs</button><button id="export">Export responses</button><p id="stats"></p><div class="scroll"><table><thead><tr><th>Guest</th><th>Decision</th><th>Role</th><th>Received</th></tr></thead><tbody id="rows"></tbody></table></div><small>Latest submission per name is counted; names are self-reported, not verified.</small></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let db,events=[],current='',responses=[];const msg=m=>$('notice').textContent=m;const fail=e=>msg(e.message||String(e));const uid=()=> 'rift-'+crypto.randomUUID().slice(0,8);let fresh=false;async function load(preferred){let {data,error}=await db.from('events').select('*').order('starts_at');if(error)throw error;events=data;current=events.some(e=>e.id===preferred)?preferred:events[0]?.id;$('events').replaceChildren(...events.map(e=>new Option(e.title,e.id)));if(current){$('events').value=current;edit(events.find(e=>e.id===current))}else newEvent();await refresh()}
function edit(e){fresh=!events.some(x=>x.id===e.id);$('id').value=e.id;for(let k of ['title','theme','message'])$(k).value=e[k];let offset=e.utc_offset||'-05:00';$('zone').value=offset;let n=(offset[0]==='-'?-1:1)*(Number(offset.slice(1,3))*60+Number(offset.slice(4)));let local=new Date(Date.parse(e.starts_at)+n*60000).toISOString();$('date').value=local.slice(0,10);$('time').value=local.slice(11,16);$('link').value='';$('preview').removeAttribute('href');$('rows').replaceChildren();if(fresh) $('stats').textContent='Save event first.'}
function newEvent(){edit({id:uid(),title:'New customs',theme:'hybrid',message:'The winds of the Freljord carry your name. Answer the call.',starts_at:new Date(Date.now()+86400000).toISOString(),utc_offset:'-05:00'})}async function refresh(){if(fresh||!current)return;let {data,error}=await db.from('rsvps').select('*').eq('event_id',current).order('created_at',{ascending:false});if(error)throw error;responses=data;let seen=new Set(), latest=data.filter(r=>{let k=r.guest.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});$('stats').textContent='Accepted: '+latest.filter(r=>r.decision==='Accept').length+' | Declined: '+latest.filter(r=>r.decision==='Decline').length;$('rows').replaceChildren();for(let r of latest){let tr=$('rows').insertRow();for(let v of [r.guest,r.decision,r.role,new Date(r.created_at).toLocaleString()])tr.insertCell().textContent=v}}
async function session(){let {data}=await db.auth.getSession();$('panel').hidden=!data.session;$('login').hidden=!!data.session;if(data.session)await load(current)}try{db=connect();session().catch(fail)}catch(e){fail(e)}$('auth').onsubmit=async e=>{e.preventDefault();try{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;$('password').value='';await session();msg('Signed in')}catch(e){fail(e)}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('events').onchange=()=>{current=$('events').value;edit(events.find(e=>e.id===current));refresh().catch(fail)};$('new').onclick=newEvent;$('duplicate').onclick=()=>{let e=events.find(x=>x.id===current);if(e)edit({...e,id:uid(),title:e.title+' (copy)'})};$('settings').onsubmit=async e=>{e.preventDefault();try{let row={id:$('id').value,title:$('title').value,theme:$('theme').value,message:$('message').value,starts_at:new Date($('date').value+'T'+$('time').value+':00'+$('zone').value).toISOString(),utc_offset:$('zone').value};let {error}=await db.from('events').upsert(row);if(error)throw error;await load(row.id);msg('Event saved. Existing short links now use the updated details.')}catch(e){fail(e)}};$('generate').onclick=()=>{if(fresh||!current)return msg('Save the event first.');let u=new URL('./',location.href);u.searchParams.set('event',current);if($('guest').value.trim())u.searchParams.set('guest',$('guest').value.trim());$('link').value=u.href;$('preview').href=u.href};$('copy').onclick=async()=>{if($('link').value)try{await navigator.clipboard.writeText($('link').value);msg('Copied')}catch{$('link').select()}};$('refresh').onclick=()=>refresh().catch(fail);setInterval(()=>{if(!$('panel').hidden)refresh().catch(fail)},15000);$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(responses,null,2)],{type:'application/json'}));a.download='rsvps.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
